name: Graph Ops CI

on:
  push:
    branches: [main, master, "feature/go-graph-ops-phase1", "feature/go-graph-ops-phase2", "feature/go-graph-ops-phase3", "feature/backend-hardening-final"]
    paths: ["services/graph-ops-go/**", ".github/workflows/graph-ops.yml", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main, master]
    paths: ["services/graph-ops-go/**", ".github/workflows/graph-ops.yml", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  go-graph-ops:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/graph-ops-go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.x"
          cache-dependency-path: services/graph-ops-go/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check Go format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test -cover ./...
      - name: Race detector
        run: go test -race ./...
      - name: Build and verify Python-to-Go HTTP contract
        run: |
          go build -o "$RUNNER_TEMP/graph-ops" ./cmd/server
          python tests/contract.py "$RUNNER_TEMP/graph-ops"
      - name: Run isolated Neo4j integration and HTTP contracts
        shell: bash
        run: |
          name="graphops-lab-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          docker run -d --rm --name "$name" -p 127.0.0.1:27687:7687 \
            -e NEO4J_AUTH=none -e NEO4J_initial_dbms_default__database=graphops-phase2-test \
            -e NEO4J_dbms_usage__report_enabled=false neo4j:5.26.18-community
          trap 'docker stop "$name" >/dev/null || true' EXIT
          for attempt in {1..30}; do
            if docker exec "$name" cypher-shell -d graphops-phase2-test 'RETURN 1'; then break; fi
            sleep 2
          done
          docker exec "$name" cypher-shell -d graphops-phase2-test 'RETURN 1'
          export GRAPHOPS_LAB_BOLT=bolt://127.0.0.1:27687
          export GRAPHOPS_LAB_MARKER="$(openssl rand -hex 32)"
          export GRAPHOPS_LAB_PLAN_KEY="$(openssl rand -hex 32)"
          export GRAPHOPS_ADMIN_TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$GRAPHOPS_LAB_MARKER"
          echo "::add-mask::$GRAPHOPS_LAB_PLAN_KEY"
          echo "::add-mask::$GRAPHOPS_ADMIN_TOKEN"
          GRAPHOPS_INTEGRATION=1 go test -race -count=1 -v ./internal/neoops -run '^TestNeo4jIntegration$'
          python tests/lab_contract.py "$RUNNER_TEMP/graph-ops"
          npm install --prefix "$RUNNER_TEMP/graphops-browser" --no-audit --no-fund playwright@1.65.1
          export NODE_PATH="$RUNNER_TEMP/graphops-browser/node_modules"
          "$NODE_PATH/.bin/playwright" install --with-deps chromium
          node tests/console.cjs "$RUNNER_TEMP/graph-ops"
          GRAPHOPS_E2E_ASSERT=1 go test -count=1 -v ./internal/neoops -run '^TestBrowserDatabaseState$'
      - name: Scan service source and fixtures for secrets
        run: |
          dir="$(mktemp -d)"
          version=8.30.1
          release="https://github.com/gitleaks/gitleaks/releases/download/v$version"
          asset="gitleaks_${version}_linux_x64.tar.gz"
          cd "$dir"
          curl -fsSLO "$release/$asset"
          curl -fsSLO "$release/gitleaks_${version}_checksums.txt"
          grep -F " $asset" "gitleaks_${version}_checksums.txt" | sha256sum -c --strict
          tar -xzf "$asset" gitleaks
          ./gitleaks dir --redact=100 --no-banner "$GITHUB_WORKSPACE/services/graph-ops-go"
