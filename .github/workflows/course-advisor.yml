name: Course Advisor

on:
  push:
    branches: ["feature/course-advisor-phase5"]
  pull_request:
    branches: [main]
    paths:
      - "services/course-advisor/**"
      - "services/prerequisite-analysis/**"
      - ".github/workflows/course-advisor.yml"

permissions:
  contents: read

jobs:
  go-sqlite-and-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/course-advisor
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
          cache-dependency-path: services/course-advisor/go.sum
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Go tests and SQLite persistence
        run: |
          go vet ./...
          go test -race -count=1 ./...
          go build -o "$RUNNER_TEMP/course-advisor" .
      - name: Python RAG and Phase 4 dependencies
        run: |
          python -m pip install -r rag/requirements.txt -r ../prerequisite-analysis/requirements.txt
          python -m unittest discover -s rag -p 'test_*.py'
      - name: Browser workflow with actual SQLite and Phase 4 HTTP
        run: |
          npm install --prefix "$RUNNER_TEMP/advisor-browser" playwright@1.65.1
          "$RUNNER_TEMP/advisor-browser/node_modules/.bin/playwright" install --with-deps chromium
          export NODE_PATH="$RUNNER_TEMP/advisor-browser/node_modules"
          node tests/browser.cjs "$RUNNER_TEMP/course-advisor" python
