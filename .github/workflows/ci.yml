name: CI

on:
  push:
    branches: [main, "feature/go-graph-ops-phase1", "feature/go-graph-ops-phase2", "feature/go-graph-ops-phase3"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python FastAPI & Sanitization Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Verify zero institutional or private artifacts
        run: |
          python -c "
          import pathlib, sys
          forbidden_ext = {'.db', '.sqlite', '.faiss', '.pkl', '.doc', '.docx', '.xlsx', '.pdf'}
          root = pathlib.Path('.')
          bad_files = [str(p) for p in root.rglob('*') if '.git' not in p.parts and p.suffix.lower() in forbidden_ext]
          assert not bad_files, f'Forbidden binary/document files found: {bad_files}'
          "
      - name: Run pytest
        run: python -m pytest -v

  go:
    name: Go Implementation Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Run go test
        run: go test -v ./...

  java:
    name: Java Implementation Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "maven"
      - name: Run Maven tests
        run: mvn -B test
